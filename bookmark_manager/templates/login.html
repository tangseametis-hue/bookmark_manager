<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>登入 - 在線書籤收藏夾</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">用戶登入</h3>
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        <!--2修改前代码 未包含 CSRF 防护隐藏域，提交表单时会被全局 CSRFProtect 拦截并报 400 Bad Request 错误
                        <form method="POST">
                        -->
                        <!--修改后代码1 注入 csrf_token 隐藏域，配合 Flask-WTF 的全局 CSRF 防护机制 -->
                        <form method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <div class="mb-3">
                                <label class="form-label">用戶名</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">密碼</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">登入</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('register') }}">新用戶？前往註冊</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
